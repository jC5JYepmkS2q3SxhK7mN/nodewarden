name: '自动更新项目'

on:
  schedule:
    # 每天北京时间早上 8 点自动运行一次
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 允许手动点击运行

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: 从原作者仓库同步最新代码

    steps:
    - name: 步骤 1：开始读取你当前仓库的代码
      run: echo "正在准备环境并检出你当前仓库的文件..."

    - name: 执行检出动作 (底层系统日志)
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE }}
        ref: main

    - name: 步骤 2：连接原作者仓库并对比更新
      run: echo "正在拉取原作者仓库，检查是否有新代码需要同步..."

    - name: 执行同步动作 (底层系统日志)
      id: sync
      uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
      with:
        target_sync_branch: main
        target_repo_token: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE }}
        upstream_sync_branch: main
        # 【注意】在这里填入原作者的用户名和仓库名
        upstream_sync_repo: 原作者用户名/原项目名称
        test_mode: false

    - name: 状态播报：同步成功
      if: steps.sync.outputs.has_new_commits == 'true'
      run: echo "太棒了！发现了原作者的新更新，并且已经成功拉取合并到你的仓库中了。"

    - name: 状态播报：无需同步
      if: steps.sync.outputs.has_new_commits == 'false'
      run: echo "原仓库目前没有新更新，你当前的代码已经是最新的。"

    - name: 步骤 3：触发防封锁保活机制
      run: echo "正在检查距离上次更新是否已接近 60 天，准备执行保活动作..."
      if: always()

    - name: 执行保活代码提交 (底层系统日志)
      uses: gautamkrishnar/keepalive-workflow@v2
      if: always()
      with:
        commit_message: "chore: 自动提交以防止 60 天无活动被 GitHub 暂停定时任务"
